[project]
name = "credito"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary,pool]>=3.2",
    "django-environ>=0.12",
    "argon2-cffi>=25.1",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "django-debug-toolbar>=6.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# --ds tem precedencia sobre a variavel de ambiente DJANGO_SETTINGS_MODULE, que
# o compose injeta via env_file e que sobrepunha o DJANGO_SETTINGS_MODULE abaixo.
addopts = "--ds=config.settings.test --reuse-db --strict-markers"

[tool.ruff]
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DTZ", "DJ", "C4", "RUF"]
# RUF012 exige ClassVar em atributos de classe mutaveis, o que briga com os
# idiomas do Django (Meta.ordering/constraints/indexes, ModelAdmin.list_display...).
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "I001"]
"config/settings/*" = ["F403", "F405"]
